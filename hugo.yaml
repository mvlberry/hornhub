baseURL: https://hornhub.me/
locale: zh-CN
defaultContentLanguage: zh
hasCJKLanguage: true
timeZone: Asia/Shanghai
title: 我的博客
theme: hugo-ivy

enableRobotsTXT: true
enableGitInfo: false
cleanDestinationDir: true

permalinks:
  post: /post/:year/:month/:day/:slug/

menu:
  main:
    - name: 首页
      pageRef: /
      weight: 10
    - name: 归档
      pageRef: /post
      weight: 20
    - name: 关于
      pageRef: /about
      weight: 30
    - name: 标签
      pageRef: /tags
      weight: 40
    - name: RSS
      url: /index.xml
      weight: 50

params:
  description: ''
  brandNote: ''
  footer: "&copy; {Year} 我的博客"
  icp: ''
  mainSections: [post]
  summary_length: 180

markup:
  goldmark:
    renderer:
      unsafe: true
  highlight:
    codeFences: true
    style: github

caches:
  images:
    dir: :cacheDir/images
